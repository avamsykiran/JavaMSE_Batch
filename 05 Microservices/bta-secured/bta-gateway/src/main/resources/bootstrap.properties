spring.application.name=gateway
server.port=9999

eureka.client.serviceUrl.defaultZone=http://localhost:9000/eureka/

eureka.client.initialInstanceInfoReplicationIntervalSeconds=5
eureka.client.registryFetchIntervalSeconds=5
eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=5

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.default-filters=TokenRelay

spring.security.oauth2.client.registration.gateway-client.client-id=gateway-client
spring.security.oauth2.client.registration.gateway-client.client-secret=gateway-secret
spring.security.oauth2.client.registration.gateway-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gateway-client.scope=openid,profile,roles
spring.security.oauth2.client.registration.gateway-client.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.provider.auth-server.issuer-uri=http://localhost:9001

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9001

management.endpoints.web.exposure.include=*
